services:
  db:
    image: postgres:16-alpine
    container_name: verity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: verity
      POSTGRES_PASSWORD: verity
      POSTGRES_DB: verity
    # Port 5433 on the host to avoid colliding with a local Postgres install.
    ports:
      - "5433:5432"
    volumes:
      - verity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verity -d verity"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verity-db-data:
